# zerolan-vtuber 配置示例（复制为 config.yaml 后填写；真实 config.yaml 不入 git）
# key 优先级：config.yaml > 环境变量（.env）

llm:
  # 任意 OpenAI 兼容端点：openai/<model> + base_url 覆盖（含豆包 Ark）
  base_url: null
  api_key: null                # 或环境变量 / .env
  model: deepseek/deepseek-chat
  fallback_models: []          # litellm.Router 降级列表
  temperature: 0.8

asr:
  vendor: baidu                # baidu | volcano | openai（也可填其他自定义串，未知 vendor 提交时回 400 并列出支持清单）
  base_url: null
  api_key: null
  secret_key: null             # 仅 baidu 需要（AK/SK 双 key）
  model: null                  # openai: whisper-1；volcano: bigmodel
  # openai 兼容端点示例（siliconflow/fish-audio/自建 whisper 等）：
  # vendor: openai
  # base_url: https://api.siliconflow.cn
  # api_path: /v1/audio/transcriptions   # 必须以 /v1/ 开头
  # model: FunAudioLLM/SenseVoiceSmall

tts:
  vendor: baidu                # baidu | mimo | openai（同上，未知 vendor 提交时回 400）
  base_url: null
  api_key: null
  secret_key: null             # 仅 baidu 需要（AK/SK 双 key）
  model: null                  # openai: tts-1；mimo: mimo-v2.5-tts
  voice: null                  # openai 默认 alloy；mimo 默认 Chloe
  # openai 兼容端点示例：
  # vendor: openai
  # base_url: https://api.openai.com
  # api_path: /v1/audio/speech          # 必须以 /v1/ 开头
  # model: tts-1
  # voice: alloy
  # audio_format: mp3                   # mp3 | opus | aac | flac | wav | pcm

tools:
  web_search:
    provider: tavily           # tavily | ddgs
  sixty_api:
    base_url: https://60s.viki.moe

server:
  ws_host: 127.0.0.1
  ws_port: 8090
  http_port: 8091
  # Live2D 模型下发：models/rice.zip 存在时 server_hello 通知客户端加载（换模型只换服务端文件）
  live2d_model: rice

broadcast:
  enabled: false
  cron: null                   # "HH:MM"

history:
  db_path: data/history.db