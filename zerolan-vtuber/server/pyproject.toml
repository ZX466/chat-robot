[project]
name = "zerolan-vtuber"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "ddgs>=9.16.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "litellm>=1.98.0",
    "loguru>=0.7.3",
    "pydantic>=2",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.52.4",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "respx>=0.23.1",
    "ruff>=0.16.5",
]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".venv", "tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
exclude = ["tests/fixtures"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
