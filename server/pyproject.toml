[project]
name = "zerolan-vtuber-server"
version = "0.1.0"
description = "zerolan-vtuber server — ASR/TTS providers 迁移草案（cline，待与 Claude 骨架合并）"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "loguru>=0.7",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
