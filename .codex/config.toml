#:schema https://developers.openai.com/codex/config-schema.json

# ECC — Codex project-local config.
# Place in project root as .codex/config.toml. No global ~/.codex changes.

model_provider = "auto"

# Runtime
approval_policy = "on-request"
sandbox_mode = "workspace-write"
web_search = "live"

persistent_instructions = "Follow AGENTS.md. Use the ECC workflow: plan, TDD, security review, verify."

# Multi-agent roles (map to .codex/agents/*.toml)
[agents]
max_threads = 6
max_depth = 1

[agents.explorer]
description = "Read-only codebase explorer for gathering evidence before changes are proposed."
config_file = "agents/explorer.toml"

[agents.reviewer]
description = "PR reviewer focused on correctness, security, and missing tests."
config_file = "agents/reviewer.toml"

[agents.docs_researcher]
description = "Docs/API research with primary-source verification."
config_file = "agents/docs-researcher.toml"

